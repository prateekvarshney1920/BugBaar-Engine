# Reverse proxy for BugBaar Engine.
# Terminates TLS, applies a coarse request cap, and forwards to the app.

upstream bugbaar_engine {
    server engine:4000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=bugbaar_api:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    # Health probes bypass the rate limit so a burst never marks the app down.
    location /health {
        proxy_pass http://bugbaar_engine;
        access_log off;
    }

    location / {
        limit_req zone=bugbaar_api burst=40 nodelay;

        proxy_pass http://bugbaar_engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Agent runs can be slow; allow long-lived upstream responses.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        client_max_body_size 12m;
    }
}
